{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {% block title %} Home {% endblock title %} | Care Carry
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    {% tailwind_css %}

  </head>
  <body>
    <header>
      <h1 class="text-2xl font-bold text-cay-secondary">Welcome to Care Carry</h1>
    </header>

    {% block content %}{% endblock content %}


    <footer>
      <p>&copy; 2023 Care Carry. All rights reserved.</p>
    </footer>
  </body>
</html>
